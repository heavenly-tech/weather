# Production stack for nginx-proxy on heavenly.
# Path on the VPS: /opt/stacks/app-heavenly-weather
# Public site: https://weather.heavenly.cl
#
# There is no `build:` key. The image is built on omarchibald or the Mac mini
# and loaded onto the VPS before `docker compose up`. See deploy.sh.
services:
  weather:
    image: app-heavenly-weather:latest
    container_name: app-heavenly-weather
    restart: unless-stopped
    environment:
      # The binary ignores NODE_ENV and HOSTNAME. They stay so an existing
      # env file does not have to change. The process binds 0.0.0.0:$PORT.
      NODE_ENV: production
      PORT: "4310"
      HOSTNAME: "0.0.0.0"
      VIRTUAL_HOST: weather.heavenly.cl
      LETSENCRYPT_HOST: weather.heavenly.cl
      VIRTUAL_PORT: "4310"
      METEOCHILE_USER: ${METEOCHILE_USER:-}
      METEOCHILE_TOKEN: ${METEOCHILE_TOKEN:-}
    networks:
      - proxy_network
      - default
    healthcheck:
      test: ["CMD", "/weather", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  proxy_network:
    external: true
  default:

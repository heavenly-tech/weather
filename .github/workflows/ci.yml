name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/dual-run-diff.mjs --self-test
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: wrf orchestrator tests
        run: python3 -m unittest discover -s scripts/wrf -p 'test_*.py'

  rust-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -f Dockerfile -t weather-rust:ci .
      - name: scratch healthcheck
        run: |
          set -eu
          docker run -d --name weather-rs -p 4310:4310 weather-rust:ci
          ok=0
          for _ in $(seq 1 25); do
            if docker run --rm --network container:weather-rs weather-rust:ci /weather healthcheck; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            docker logs weather-rs || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:4310/api/health -o /tmp/health.body
          cmp server-rs/tests/fixtures/parity/api-health.body /tmp/health.body
          curl -fsS http://127.0.0.1:4310/ -o /tmp/index.html
          grep -q 'id="root"' /tmp/index.html
          code=$(curl -fsS -o /tmp/spa.html -w '%{http_code}' http://127.0.0.1:4310/metar-taf)
          test "$code" = 200
          cmp /tmp/index.html /tmp/spa.html
          curl -fsS -o /dev/null -D - http://127.0.0.1:4310/cesium/Widgets/widgets.css | grep -qi 'content-type: text/css'
          curl -fsS -D - -o /dev/null http://127.0.0.1:4310/ | grep -q "script-src 'self' 'wasm-unsafe-eval'"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: globe under CSP
        run: node scripts/check-csp-globe.mjs